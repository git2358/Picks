<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Random Movie Picker</title>
<link rel="stylesheet" href="style.css?v=20261007143500">
</head>
<body>
<div id="bgBackdrop" class="bg-backdrop"></div>
<div class="bg-overlay"></div>
<main class="wrapper">
<div class="content-card">
<div class="poster-container">
<img id="moviePoster" src="" alt="Movie Poster">
</div>
<div class="info-container">
<div class="info-top">
<div class="title-speech-row">
<h1 id="movieTitle" class="movie-title">Loading...</h1>
<button id="speakBtn" class="speak-btn" onclick="toggleSpeech()" style="display:none">🔊 Listen</button>
</div>
<div id="movieYear" class="movie-year"></div>
<div class="synopsis-scroll-area">
<div class="movie-section">
<h2 class="section-heading">Synopsis</h2>
<p id="movieSynopsis" class="movie-synopsis">Please ensure movies.txt is loaded correctly.</p>
</div>
<div id="movieBlurbSection" class="movie-section">
<h2 class="section-heading">Movie Blurb</h2>
<p id="movieBlurb" class="movie-blurb">Loading...</p>
</div>
<div class="movie-section movie-details-section">
<h2 class="section-heading">Movie Details</h2>
<div id="movieDetails" class="movie-details"></div>
</div>
</div>
</div>
<div class="info-bottom">
<button id="reloadBtn" class="reload-btn" onclick="fetchNextMovie()">Get Another Movie</button>
</div>
</div>
</div>
</main>
<div class="version">20261007143500</div>
<div id="curtainOverlay" class="curtain-overlay">
<div class="curtain left"></div>
<div class="curtain right"></div>
<div class="stage-lighting" id="stageLighting"></div>
<div class="spotlight-content" id="spotlightContent">
<div class="spotlight-text">That’s a wrap! Every movie has been featured.</div>
<button class="reload-btn" onclick="location.reload()">Refresh to Start Over</button>
</div>
</div>
<script src="script.js?v=20261007143500"></script>
</body>
</html>
