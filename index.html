<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Movie Picker</title>
    <link rel="stylesheet" href="style.css?v=20261004165500">
</head>
<body>

    <!-- Background Backdrop filling window -->
    <div id="bgBackdrop" class="bg-backdrop"></div>
    <div class="bg-overlay"></div>

    <div class="wrapper">
        <div class="content-card">
            <div id="posterContainer" class="poster-container">
                <img id="moviePoster" src="" alt="Movie Poster" style="display: none;">
                <div id="posterLoader" class="loader-container">
                    <div class="dot-pulse"></div>
                </div>
            </div>
            <div class="info-container">
                <div class="info-top">
                    <div class="title-speech-row">
                        <h1 id="movieTitle" class="movie-title">Loading...</h1>
                        <button id="speakBtn" class="speak-btn" onclick="toggleSpeech()" title="Read Synopsis Aloud" style="display: none;">🔊 Read Synopsis</button>
                    </div>
                    <div id="movieYear" class="movie-year"></div>
                    <div class="synopsis-scroll-area">
                        <p id="movieSynopsis" class="movie-synopsis">
                            <span id="synopsisLoader" class="loader-container inline-loader">
                                <span class="dot-pulse"></span>
                            </span>
                        </p>
                    </div>
                </div>
                <div class="info-bottom">
                    <button class="reload-btn" onclick="pickRandomMovie()">Pick Another Movie</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js?v=20261004165500"></script>
</body>
</html>
