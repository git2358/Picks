<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Picks</title>
<script>
function makeVersionHash(input) {
  var h = [0x243f6a88, 0x85a308d3, 0x13198a2e, 0x03707344];
  for (var i = 0; i < input.length; i++) {
    var c = input.charCodeAt(i);
    for (var j = 0; j < 4; j++) {
      h[j] = Math.imul(h[j] ^ (c + i + j * 0x9e3779b9), 0x45d9f3b);
      h[j] = (h[j] ^ (h[j] >>> 16)) >>> 0;
    }
  }
  return h.map(function (n) { return n.toString(16).padStart(8, '0'); }).join('');
}
function readSource(path) {
  var request = new XMLHttpRequest();
  request.open('GET', path, false);
  request.send(null);
  if (request.status < 200 || request.status >= 300) throw new Error('Unable to read ' + path);
  return request.responseText;
}
var sourceFiles = [location.pathname, 'style.css', 'script.js'];
var sourceText = sourceFiles.map(function (path) {
  return path + '\n' + readSource(path);
}).join('\n\n');
var v = makeVersionHash(sourceText).slice(0, 32);
document.write('<link rel="stylesheet" href="style.css?v='+v+'">');
</script>
</head>
<body>
<div id="bgBackdrop" class="bg-backdrop"></div>
<div class="bg-overlay"></div>
<main class="wrapper">
<div class="content-card">
<div class="poster-container">
<div class="poster-flip-card" id="posterFlipCard">
<div id="posterLink" class="poster-link poster-face poster-front" role="button" tabindex="0" aria-label="Tap to reveal movie searches" aria-haspopup="true" aria-expanded="false" title="Tap to search YouTube">
<img id="moviePoster" src="" alt="Movie Poster">

</div>
<div id="movieSearchMenu" class="movie-search-menu poster-face poster-back" role="menu" aria-label="Search this movie on YouTube" aria-hidden="true" inert>
<img id="searchPosterBackdrop" class="search-poster-backdrop" src="" alt="" aria-hidden="true">
<div class="search-poster-overlay" aria-hidden="true"></div>
<div class="movie-search-actions">
<button type="button" role="menuitem" data-search-type="full movie">Movie</button>
<button type="button" role="menuitem" data-search-type="trailer">Trailers</button>
<button type="button" role="menuitem" data-search-type="behind the scenes">BTS</button>
<button type="button" role="menuitem" data-search-type="making of">Making Of</button>
<button type="button" role="menuitem" data-search-type="history">History</button>
<button type="button" role="menuitem" data-search-type="wikipedia">Wikipedia</button>
</div>
<div class="poster-back-controls">
<input id="tmdbApiKey" class="custom-search-url tmdb-api-key" type="password" aria-label="TMDB API key" placeholder="TMDB API key (optional)" autocomplete="off" spellcheck="false">
<input id="customSearchUrl" class="custom-search-url" type="url" aria-label="Custom search URL" placeholder="Custom search URL" autocomplete="url" spellcheck="false">
<div class="poster-back-actions">
<button type="button" class="movie-search-close" aria-label="Return to poster">Poster</button>
<button type="button" id="watchNowBtn" class="watch-now-btn" hidden>Watch Now</button>
</div>
</div>
</div>
</div>
</div>
<div class="info-container">
<div class="info-top">
<div class="title-speech-row">
<h1 id="movieTitle" class="movie-title">Loading...</h1>
<span id="movieSourceBadge" class="movie-source-badge" aria-label="Movie list source">NEW</span>

</div>
<div id="movieYear" class="movie-year"></div>
<div class="synopsis-scroll-shell">
<div class="synopsis-scroll-area">
<details id="movieSynopsisSection" class="movie-section" open>
<summary class="section-heading">Synopsis</summary>
<p id="movieSynopsis" class="movie-synopsis">Please ensure movies.txt is loaded correctly.</p>
</details>
<details id="movieBlurbSection" class="movie-section" open>
<summary class="section-heading">Blurb</summary>
<p id="movieBlurb" class="movie-blurb">Loading...</p>
</details>
<details id="moviePlotSummarySection" class="movie-section" hidden>
<summary class="section-heading">Plot</summary>
<p id="moviePlotSummary" class="movie-plot-summary"></p>
</details>

<details id="movieDetailsSection" class="movie-section movie-details-section" open>
<summary class="section-heading">Details</summary>
<div id="movieDetails" class="movie-details"></div>
</details>
</div>
</div>
</div>
<div class="info-bottom">
<button id="reloadBtn" class="reload-btn" onclick="fetchNextMovie()">Next Movie</button>
<button id="shareMovieBtn" class="share-movie-btn" onclick="copyMovieUrl()">Share Movie</button>
</div>
</div>
</div>
</main>
<div class="version-left"></div>
<div id="curtainOverlay" class="curtain-overlay">
<div class="curtain left"></div>
<div class="curtain right"></div>
<div class="stage-lighting" id="stageLighting"></div>
<div class="spotlight-content" id="spotlightContent">
<div class="spotlight-text">That’s a wrap!<br>Every movie has been featured.</div>
<button class="reload-btn" onclick="location.reload()">Refresh to Start Over</button>
</div>
</div>
<script>
document.querySelector('.version-left').textContent=v;
document.write('<script src="script.js?v='+v+'"><\/script>');
</script>
</body>
</html>
